name: inject_flutter
description: >-
  Flutter integration for inject_annotation. Provides ViewModelFactory and
  ViewModelBuilder to inject ViewModels into widgets with automatic lifecycle
  management, plus SubcomponentBuilder to own a @subcomponent graph's
  lifecycle from a widget.
version: 1.2.1
documentation: https://ralph-bergmann.github.io/inject.dart/
repository: https://github.com/ralph-bergmann/inject.dart
issue_tracker: https://github.com/ralph-bergmann/inject.dart/issues
topics:
  - flutter
  - dependency-injection
  - architecture
  - state-management
  - clean-architecture

environment:
  sdk: ^3.13.1
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  inject_annotation: ^1.2.0
  inject_generator: ^1.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
