name: inject_annotation
description: >-
  Constructor-based dependency injection for Dart and Flutter, inspired by
  Dagger. Declare your object graph with annotations; inject_generator wires it
  at build time.
version: 1.1.0
documentation: https://ralph-bergmann.github.io/inject.dart/
repository: https://github.com/ralph-bergmann/inject.dart
issue_tracker: https://github.com/ralph-bergmann/inject.dart/issues
topics:
  - dependency-injection
  - dart
  - flutter
  - architecture

environment:
  sdk: ^3.12.0
resolution: workspace

dependencies:
  meta: ^1.18.0

dev_dependencies:
  lints: ^6.1.0
