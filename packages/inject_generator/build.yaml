builders:
  factory_builder:
    import: "package:inject_generator/inject_generator.dart"
    builder_factories: ["factoryBuilder"]
    build_extensions: {".dart": [".factory.dart"]}
    auto_apply: dependents
    build_to: source
    runs_before: ["inject_generator|inject_builder"]
  inject_builder:
    import: "package:inject_generator/inject_generator.dart"
    builder_factories: ["injectBuilder"]
    build_extensions: {".dart": [".inject.dart"]}
    auto_apply: dependents
    build_to: source
