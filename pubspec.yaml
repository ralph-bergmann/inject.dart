name: inject_dart_workspace
publish_to: none
repository: https://github.com/ralph-bergmann/inject.dart
issue_tracker: https://github.com/ralph-bergmann/inject.dart/issues

environment:
  sdk: ^3.12.0

workspace:
  - examples/example
  - examples/flutter_demo
  - examples/flutter_demo/packages/counter_analytics
  - packages/inject_annotation
  - packages/inject_flutter
  - packages/inject_generator

dev_dependencies:
  melos: ^8.0.0

melos:
  ide:
    intellij:
      enabled: true
  scripts:
    analyze:
      exec: dart analyze .

    fix:
      exec: dart fix --apply

    format:
      exec: dart format -l 120 .

    pubupgrade:
      run: melos run pubupgrade:dart && melos run pubupgrade:flutter
    pubupgrade:dart:
      run: melos exec -c 1 --fail-fast -- "dart pub upgrade"
      packageFilters:
        flutter: false
    pubupgrade:flutter:
      run: melos exec -c 1 --fail-fast -- "flutter pub upgrade"
      packageFilters:
        flutter: true

    build:
      run: melos run build:dart && melos run build:flutter
    build:dart:
      run: melos exec -c 1 --fail-fast -- "dart run build_runner clean && dart run build_runner build -d"
      packageFilters:
        dependsOn: build_runner
        flutter: false
    build:flutter:
      run: melos exec -c 1 --fail-fast -- "flutter pub run build_runner clean && flutter pub run build_runner build -d"
      packageFilters:
        dependsOn: build_runner
        flutter: true

    test:
      run: melos run test:plain --no-select && melos run test:build-runner-dart --no-select && melos run test:build-runner-flutter --no-select
    test:plain:
      run: melos exec -c 1 --fail-fast -- "dart test"
      packageFilters:
        noDependsOn: build_runner
        dirExists: test
        flutter: false
    test:build-runner-dart:
      run: melos exec -c 1 --fail-fast -- "dart run build_runner clean && dart run build_runner test -d"
      packageFilters:
        dependsOn: build_runner
        dirExists: test
        flutter: false
    test:build-runner-flutter:
      run: melos exec -c 1 --fail-fast -- "dart run build_runner clean && dart run build_runner build -d &&  flutter test"
      packageFilters:
        dependsOn: build_runner
        dirExists: test
        flutter: true

    # End-to-end smoke for every example package: pub get, regenerate code,
    # then dart analyze. Split into three stages so a failure points at the
    # offending stage (pub vs. build vs. analyze) instead of one opaque step.
    analyze:examples:
      run: melos run analyze:examples:get --no-select && melos run analyze:examples:build --no-select && melos run analyze:examples:analyze --no-select
    analyze:examples:get:
      run: melos exec -c 1 --fail-fast --scope="example,flutter_demo" -- "dart pub get"
    analyze:examples:build:
      run: melos exec -c 1 --fail-fast --scope="example,flutter_demo" -- "dart run build_runner build --delete-conflicting-outputs"
    analyze:examples:analyze:
      run: melos exec -c 1 --fail-fast --scope="example,flutter_demo" -- "dart analyze"
